name: Check in

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Build image"]
    types:
      - completed

  # UTC时间，对应Beijing时间 8：30
  schedule:
    - cron: "26 23 * * *"

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      SMZDM_COOKIE: ${{ secrets.ANDROID_COOKIE }}
      SMZDM_SK: ${{ secrets.SK }}
      SMZDM_PUSH_PLUS_TOKEN: ${{ secrets.PUSH_PLUS_TOKEN }}
      SMZDM_SC_KEY: ${{ secrets.SC_KEY }}
      SMZDM_TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
      SMZDM_TG_USER_ID: ${{ secrets.TG_USER_ID }}
      SMZDM_TG_API_BASE: ${{ secrets.TG_BOT_API }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install -e .

      - name: Working
        run: |
          smzdm-bot run
